  <style>

    body {
      height: 100%;
      margin: 0;

      font-family: Arial, Helvetica, sans-serif;
    }
    .full-screen { position: relative; min-height: 100vh; }
    .page-heading {
      position: absolute; top: 20vh; left: 50%; transform: translateX(-50%);
      text-align: center; font-size: 2rem; font-weight: 600;
    }
    .subtitle {
      position: absolute; top: calc(20vh + 3.25rem); left: 50%; transform: translateX(-50%);
      font-size: 1rem; color: #d0d0d0;
    }
    .lang-row {
      position: absolute; top: calc(20vh + 7rem); left: 50%; transform: translateX(-50%);
      display: flex; gap: 2.25rem;
    }
    .lang { cursor: pointer; text-align: center; }
    .lang img { width: 96px; height: 96px; transition: transform 0.2s; }
    .lang:hover img { transform: scale(1.1); }
    .lang span { color: #fff; }
  </style>
</head>
